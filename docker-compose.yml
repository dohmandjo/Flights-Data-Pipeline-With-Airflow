# Requires Docker Compose v2.
#   cp .env.example .env      # fill it in (generation one-liners are inside)
#   docker compose up -d --build
name: flights-airflow

# Shared settings for the three Airflow containers.
x-airflow-common: &airflow-common
  build: ./airflow
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?set AIRFLOW_SECRET_KEY in .env}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}@postgres:5432/airflow
    # Connection used by the warehouse DAG (JSON form: no URL-escaping problems with special characters in the password).
    AIRFLOW_CONN_WAREHOUSE_DB: >-
      {"conn_type": "postgres", "host": "postgres", "port": 5432,
       "login": "${PGUSER}", "password": "${PGPASSWORD}", "schema": "${PGDATABASE}"}
    # Read by dags/sheets_export.py (Google Sheets DAG)
    PGHOST: postgres
    PGPORT: "5432"
    PGDATABASE: ${PGDATABASE}
    PGUSER: ${PGUSER}
    PGPASSWORD: ${PGPASSWORD}
    GSHEET_ID: ${GSHEET_ID:-}
    GWORKSHEET_TITLE: ${GWORKSHEET_TITLE:-Fact_Status}
    GOOGLE_APPLICATION_CREDENTIALS: /secrets/gsa-keys.json
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    # Service-account key lives OUTSIDE the repository.
    - ${GSA_KEY_PATH:-~/gsa/gsa-keys.json}:/secrets/gsa-keys.json:ro

services:
  # ------------------------------------------------------------------ streaming
  kafka:
    image: bitnami/kafka:3.7
    container_name: flight_kafka
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      # internal broker (9092), controller (9093), host client (9091)
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9091
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9091
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports:
      - "9091:9091"
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  producer:                       # Aviationstack API -> Kafka
    build: ./kafkaproducer
    container_name: producer_flight
    environment:
      AVIATIONSTACK_KEY: ${AVIATIONSTACK_KEY:?set AVIATIONSTACK_KEY in .env}
      BOOTSTRAP_SERVERS: kafka:9092
      TOPIC: flights_live
      POLL_SECONDS: ${POLL_SECONDS:-15}   # one API request per poll; raise it to stay within your plan's quota
    depends_on:
      kafka: {condition: service_healthy}
    restart: unless-stopped

  # ------------------------------------------------------------------ warehouse
  postgres:
    image: postgres:16
    container_name: postgres_flight
    ports:
      - "5433:5432"               # host port 5433 avoids clashing with a local Postgres
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}  # used only by 01_create_airflow_db.sh
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts run once, in name order, the first time the volume is created.
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  spark:                          # Kafka -> Structured Streaming -> Postgres staging
    build: ./spark_app
    container_name: spark_flight
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: flights_live
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
    command:
      - /opt/bitnami/spark/bin/spark-submit
      - --conf
      - spark.jars.ivy=/opt/bitnami/spark/app/ivy
      - --packages
      - org.postgresql:postgresql:42.7.3,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.6
      - /opt/bitnami/spark/app/stream_to_postgres.py
    restart: unless-stopped

  # ------------------------------------------------------------------ orchestration
  airflow-init:                   # one-shot: migrate the metadata DB, create the admin user
    <<: *airflow-common
    command:
      - bash
      - -c
      - >-
        airflow db migrate &&
        (airflow users create --role Admin --firstname Admin --lastname User --email admin@example.com
        --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}"
        || echo "Admin user already exists")
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_flight
    command: webserver
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      postgres: {condition: service_healthy}
      airflow-init: {condition: service_completed_successfully}
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler_flight
    command: scheduler
    depends_on:
      postgres: {condition: service_healthy}
      airflow-init: {condition: service_completed_successfully}
    restart: unless-stopped

volumes:
  pgdata:
