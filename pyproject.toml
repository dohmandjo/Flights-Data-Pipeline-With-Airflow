[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["sheets_export", "warehouse_sql", "_defaults", "pg"]
# The repo's airflow/ folder makes ruff guess the Airflow package is first-party.
known-third-party = ["airflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"
